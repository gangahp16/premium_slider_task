<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Policy Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Insurance Policies</h2>

  <!-- Filter Section -->
  <div class="filter-box">
    <input type="number" id="minPrice" placeholder="Min Premium">
    <input type="number" id="maxPrice" placeholder="Max Premium">
    <button onclick="filterPolicies()">Filter</button>
    <button onclick="loadPolicies()">Reset</button>
  </div>

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th>Policy Name</th>
        <th>Type</th>
        <th>Company</th>
        <th>Premium</th>
      </tr>
    </thead>
    <tbody id="policyTableBody">
      <!-- Data comes from JS -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
