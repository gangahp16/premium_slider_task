<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Policy Filter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Insurance Policies</h2>

  <!-- Filter Section -->
  <div class="filter-box">
  <label>
    Max Premium: 
    <span id="priceValue">5000</span>
  </label>
  <br><br>

  <input 
  type="range" 
  id="priceSlider"
  min="0"
  step="500"
  value="0"
  oninput="updateSliderValue()"
/>
</div>

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th>Policy Name</th>
        <th>Type</th>
        <th>Company</th>
        <th>Premium</th>
      </tr>
    </thead>
    <tbody id="policyTableBody">
      <!-- Data comes from JS -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
